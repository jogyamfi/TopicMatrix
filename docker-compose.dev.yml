# Starts ONLY PostgreSQL so a developer can run the API on the host against a
# containerised database (T1 with PostgreSQL, FR-D.9). The app itself is never
# containerised by this file.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topicmatrix
      POSTGRES_PASSWORD: topicmatrix
      POSTGRES_DB: topicmatrix
    ports:
      - '5432:5432'
    volumes:
      - topicmatrix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U topicmatrix']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  topicmatrix-postgres-data:
