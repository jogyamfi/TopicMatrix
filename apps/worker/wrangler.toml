# Cloudflare Workers entrypoint (T3/T5). Optional deployment target — see documents/planning/adr-001-data-access.md.
name = "topicmatrix"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DATABASE_PROVIDER = "d1"
NODE_ENV = "production"
LOG_LEVEL = "info"

# Bound in P0's D1 spike (documents/planning/adr-001-data-access.md); real tables land at P1.
[[d1_databases]]
binding = "DB"
database_name = "topicmatrix-spike"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"

# JWT_SECRET and ARGON2_* are set with `wrangler secret put` — never committed here (SEC-5).
