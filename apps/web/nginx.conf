# Serves the built SPA and reverse-proxies /api to the api container, same-origin — mirrors
# apps/web/vite.config.ts's dev-server proxy (matching path-rewrite behaviour: /api is stripped
# before forwarding) so the browser never needs CORS in the self-hosted (docker compose) target.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback routing — client-side routes (React Router) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
