# Serves the built SPA and reverse-proxies /api to the api container, same-origin — mirrors
# apps/web/vite.config.ts's dev-server proxy (matching path-rewrite behaviour: /api is stripped
# before forwarding) so the browser never needs CORS in the self-hosted (docker compose) target.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's hashed build output: a new build means new file names, so cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, /theme-init.js, and the SPA fallback for client-side routes)
    # isn't content-hashed, so it must be revalidated on every load — otherwise a deploy leaves
    # browsers running an index.html that points at asset files that no longer exist.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
