# Security headers for the SPA's own responses (R5, SEC-6) — the API sets its own on /api/*.
# Included in every `location` that serves the app: nginx drops server-level `add_header`s in any
# location that declares its own, so declaring them once here and including it everywhere is the
# only way they reliably apply.
#
# The CSP matches the API's: everything same-origin, no inline scripts (the pre-paint theme
# script is a file, /theme-init.js, for exactly this reason). React applies `style` props through
# the CSSOM, which `style-src 'self'` allows, so no 'unsafe-inline' is needed for styles either.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignored by browsers over plain http; takes effect once a TLS proxy is in front (deployment.md).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
